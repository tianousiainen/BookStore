<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add book</title>
</head>
<body>
    <h1>Add book</h1>
    <form method="post" action="#" th:action="@{/savebook}" th:object= ${book}>
        <p>Author: <input type="text" th:field="${book.author}"></p>
        <p>Title: <input type="text" th:field="${book.title}"></p>
        <p>ISBN: <input type="text" th:field="${book.isbn}"></p>
        <p>Year: <input type="text" th:field="${book.publicationYear}"></p>
        <input type="submit" value="Submit"> <input type="reset" value="Reset">
    </form>


    </form>
</body>
</html>
