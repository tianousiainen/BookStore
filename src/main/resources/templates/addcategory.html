<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add category</title>
</head>
<body>
    <h1>Add category</h1>
    <form method="post" action="#" th:action="@{/savecategory}" th:object= ${category}>
        <p>Category: <input type="text" th:field="${category.name}"></p>
        <input type="submit" value="Submit"> <input type="reset" value="Reset">
    </form>
</body>
</html>
