<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklist</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
        <h1>Books</h1>

        <div class="d-flex justify-content-between aling-items-center me-4">
            <h1>Welcome <span sec:authentication="name"></span></h1>

            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign out" class="btn btn-sm btn-danger">
            </form>
        </div>

        <table class="table table-striped" >
		<tr>
			<th>Author</th>
			<th>Title</th>
            <th>ISBN</th>
            <th>Year</th>
            <th>Category</th>
            <th> </th>
            <th> </th>
		</tr>

		<!-- TABLE ROWS FOR Books -->
		<tr th:each="book : ${books}">
			<td th:text="${book.author}">author</td>
			<td th:text="${book.title}">title</td>
            <td th:text="${book.isbn}">isbn</td>
            <td th:text="${book.publicationYear}">year</td>
            <td th:text="${book.category.name}">year</td>
           <td sec:authorize="hasAuthority('ADMIN')">
                <a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
            </td>
           <td><a type="button" class="btn btz-xs btn-secondary" th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
		</tr> 
	</table>
        <p><a class="btn btn-success" th:href="@{/addbook}">Add new book</a></p>
</body>
</html>
